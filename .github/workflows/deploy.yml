name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        # npm ci потребує package-lock.json. Якщо його ще не закомітили —
        # відкочуємось на звичайний install, щоб перша публікація не впала.
        run: npm ci --prefer-offline || npm install
      # Публікація не має відбутися з коду, що не пройшов власні перевірки:
      # PR отримує ту саму перевірку в ci.yml, але прямий push у main обходить
      # PR, тож без цих кроків тут поламаний код міг би доїхати до Pages.
      - name: Перевірка типів
        run: npm run typecheck
      - name: Перевірки (геометрія, шрифти, растр, файли, рантайм)
        run: npm run check
      - name: Build
        # Сайт живе за адресою https://<owner>.github.io/<repo>/
        run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
